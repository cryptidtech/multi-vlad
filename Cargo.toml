[package]
name = "multi-vlad"
version = "0.4.0"
edition = "2021"
rust-version = "1.99"
authors = ["Dave Grantham <dwg@linuxprogrammer.org>"]
description = "Verifiable Long-Lived Address (VLAD) implementation"
repository = "https://github.com/cryptidtech/multi-vlad.git"
readme = "README.md"
license = "Apache-2.0"
keywords = ["vlad", "multisig", "provenance", "wasm", "multiformats"]
categories = ["cryptography", "encoding"]

[features]
default = ["serde", "xmss"]
xmss = ["multi-key/xmss"]

[dependencies]
multi-base = { version = "1.1", default-features = false }
multi-codec = "2.0"
multi-key = { version = "3.2", default-features = false, features = [
  "bcrypt",
  "bls12-381",
  "chacha20",
  "curve25519",
  "fn-dsa",
  "frodokem",
  "lamport",
  "mayo",
  "ml-dsa",
  "ml-kem",
  "p256",
  "p384",
  "p521",
  "secp256k1",
  "serde",
  "slh-dsa",
  "sntrup",
  "threshold",
  "xmss",
] }
multi-sig = "3.0"
multi-trait = { version = "1.1", default-features = false }
multi-util = "2.0"
thiserror = "2.0"
serde = { version = "1.0", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
criterion = "0.8"
multi-cbor = "0.2"
proptest = "1.12"
rand = "0.10"
serde_json = "1.0"
zeroize = "1.9"

[[bench]]
name = "multivlad_bench"
harness = false
path = "benches/multivlad_bench.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = { level = "allow", priority = 1 }
