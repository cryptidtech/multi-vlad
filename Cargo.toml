[package]
name = "multi-vlad"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
authors = ["Dave Grantham <dwg@linuxprogrammer.org>"]
description = "Verifiable Long-Lived Address (VLAD) implementation"
repository = "https://github.com/cryptidtech/multi-vlad.git"
readme = "README.md"
license = "Apache-2.0"
keywords = ["vlad", "multisig", "provenance", "wasm", "multiformats"]
categories = ["cryptography", "encoding"]

[features]
default = ["serde", "dag_cbor"]
dag_cbor = ["dep:multi-cbor", "multi-cbor/tags"]

[dependencies]
multi-base = { version = "1.0", default-features = false }
multi-codec = "1.1"
multi-key = "1.0"
multi-sig = "1.1"
multi-trait = { version = "1.0.5", default-features = false }
multi-util = "1.1"
thiserror = "2.0"
serde = { version = "1.0", default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
multi-cbor = { version = "0.1", optional = true }

[dev-dependencies]
criterion = "0.8"
multi-cbor = "0.1"
proptest = "1.4"
rand = "0.10"
serde_json = "1.0"

[[bench]]
name = "multivlad_bench"
harness = false
path = "benches/multivlad_bench.rs"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# The dependency graph pulls in both syn 2.x (via serde_derive) and syn 3.x
# (via procedural-macro crates in the dev/test graph). This clears when the
# ecosystem upgrades.
multiple_crate_versions = { level = "allow", priority = 1 }